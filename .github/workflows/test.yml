name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # Each job's modules, but on Windows and with DBI 1.643, are installed
  # by actions-setup-perl, into local/, which it caches, keyed on the
  # Perl, the cpanfile, cpanm's arguments and the modules it's given by
  # name; so a job installs almost nothing until the cpanfile changes
  # (roadmap 2026-0033, from Ekorn-Pipeline's 2026-0047). The cache
  # keeps the versions it was made with: to install the newest, delete
  # the caches, as docs/MAINTAINING.md says. Ekorn::Pipeline is the
  # exception, reinstalled at the newest version in the cpanfile's
  # range, so the tests still run on the Ekorn release users get. A
  # failed install prints cpanm's build log, as it stays on the runner
  # otherwise.

  # The tests on Perl 5.36, the floor, to the newest on Linux. Of the
  # develop modules, they need only yath, and UUID, which the cpanfile
  # lists beside it, and Text::CSV, which xt/examples.t needs for the
  # user guide's CSV examples, so those are named, and the rest left to
  # the style and coverage jobs; naming them also keeps this job's cache
  # apart from theirs.
  perl:
    name: perl ${{ matrix.perl }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        perl: ["5.36", "5.38", "5.40", "5.42", "5.44"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        id: perl
        with:
          perl-version: ${{ matrix.perl }}
          install-modules-with: cpanm
          install-modules: |
            Test2::Harness
            Text::CSV
            UUID
      - name: Ekorn, the newest in range
        id: ekorn
        shell: bash
        run: >-
          cpanm --notest --local-lib-contained local --reinstall
          "Ekorn::Pipeline~$(perl -nE 'say $1 if m( \A requires \s+ .Ekorn::Pipeline. \s* , \s* .([^\x27]+). )x' cpanfile)"
      - name: cpanm's build log
        if: failure() && (steps.perl.outcome == 'failure' || steps.ekorn.outcome == 'failure')
        shell: bash
        run: cat "$(ls -td ~/.cpanm/work/*/ | head -1)build.log"
      - name: yath
        run: yath test

  # The tests on Windows, at Perl 5.36 and 5.42, as CPAN Testers'
  # Windows testers run them: the v3.0.0 trial failed there, where a
  # test's child program, given after -e, had its quotes mangled by the
  # command line. yath doesn't support Windows, so prove runs t/, as an
  # installer would, without the develop modules. Git is told not to
  # turn LF into CRLF, so the files are as the tarball has them.
  #
  # Strawberry Perl, as most of those testers have, with DBD::SQLite
  # among its modules: with setup-perl's own builds, on 5.42 and 5.44,
  # DBD::SQLite 1.78's Makefile.PL ended without writing a Makefile, or
  # saying why. Not 5.44, as Ekorn-Pipeline's CI has it, as no tester
  # runs it on Windows.
  windows:
    name: perl ${{ matrix.perl }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        perl: ["5.36", "5.42"]
    steps:
      - name: LF as it is
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
          distribution: strawberry
      # PowerShell, the default here: Git's bash would find Git's own perl.
      - name: dependencies
        run: |
          cpanm --notest --installdeps .
          if ($LASTEXITCODE -ne 0) {
            $work = Get-ChildItem "$HOME\.cpanm\work" -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
            Get-Content (Join-Path $work.FullName 'build.log')
            exit 1
          }
      - name: prove
        run: prove -l t

  # The tests on the DBI that Debian 12 and Ubuntu 24.04 ship, 1.643,
  # with Perl 5.36, the floor: a DBI older than CPAN's newest, as many
  # system Perls have. It's installed first, and checked after the rest,
  # as the cpanfile takes any DBI. The v2.0.3 trial failed on it, on
  # CPAN Testers, where CI's newest DBI hadn't. It isn't cached:
  # setup-perl would install the cpanfile's modules, against the newest
  # DBI, before DBI 1.643 could go in.
  old-dbi:
    name: perl 5.36, DBI 1.643 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.36"
      - name: DBI 1.643
        run: cpanm --notest TIMB/DBI-1.643.tar.gz
      - name: dependencies
        shell: bash
        run: >-
          cpanm --notest --installdeps --with-develop . ||
          { cat "$(ls -td ~/.cpanm/work/*/ | head -1)build.log"; exit 1; }
      - name: check the DBI
        run: perl -MDBI -e 'die "DBI is $DBI::VERSION, not 1.643\n" unless $DBI::VERSION eq "1.643"; print "DBI $DBI::VERSION\n"'
      - name: yath
        run: yath test

  # Perl::Critic and Perl::Tidy, with the repository's profiles, on the
  # newest Perl. A file perltidy would change fails, showing the diff.
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        id: perl
        with:
          perl-version: "5.44"
          install-modules-with: cpanm
          install-modules-args: --with-develop
      - name: cpanm's build log
        if: failure() && steps.perl.outcome == 'failure'
        shell: bash
        run: cat "$(ls -td ~/.cpanm/work/*/ | head -1)build.log"
      - name: perlcritic
        run: perlcritic lib
      - name: perltidy
        run: |
          status=0
          for f in $(git ls-files 'lib/*.pm' 't/*.t' 'xt/*.t'); do
            perltidy "$f" | diff -u "$f" - || status=1
          done
          exit $status

  # The tests under Devel::Cover, on Perl 5.36, the floor, failing if the
  # coverage of lib/ falls below the floors in scripts/coverage. There's
  # no MySQL or PostgreSQL here, so the floors are what SQLite reaches.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        id: perl
        with:
          perl-version: "5.36"
          install-modules-with: cpanm
          install-modules-args: --with-develop
      - name: Ekorn, the newest in range
        id: ekorn
        shell: bash
        run: >-
          cpanm --notest --local-lib-contained local --reinstall
          "Ekorn::Pipeline~$(perl -nE 'say $1 if m( \A requires \s+ .Ekorn::Pipeline. \s* , \s* .([^\x27]+). )x' cpanfile)"
      - name: cpanm's build log
        if: failure() && (steps.perl.outcome == 'failure' || steps.ekorn.outcome == 'failure')
        shell: bash
        run: cat "$(ls -td ~/.cpanm/work/*/ | head -1)build.log"
      - name: coverage
        run: scripts/coverage

  # Secrets in any commit, not only the latest: gitleaks over the whole
  # history, since all of it is published with the repository. Its release
  # is checked against its published SHA-256 before it's used.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
