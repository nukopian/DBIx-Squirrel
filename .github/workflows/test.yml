name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests on Perl 5.36, the floor, to the newest on Linux, and the
  # newest on macOS. --with-develop brings yath and UUID with the rest.
  perl:
    name: perl ${{ matrix.perl }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        perl: ["5.36", "5.38", "5.40", "5.42", "5.44"]
        include:
          - os: macos-26
            perl: "5.44"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
      - name: dependencies
        run: cpanm --notest --installdeps --with-develop .
      - name: yath
        run: yath test

  # The tests on the DBI that Debian 12 and Ubuntu 24.04 ship, 1.643,
  # with Perl 5.36, the floor: a DBI older than CPAN's newest, as many
  # system Perls have. It's installed first, and checked after the rest,
  # as the cpanfile takes any DBI. The v2.0.3 trial failed on it, on
  # CPAN Testers, where CI's newest DBI hadn't.
  old-dbi:
    name: perl 5.36, DBI 1.643 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.36"
      - name: DBI 1.643
        run: cpanm --notest TIMB/DBI-1.643.tar.gz
      - name: dependencies
        run: cpanm --notest --installdeps --with-develop .
      - name: check the DBI
        run: perl -MDBI -e 'die "DBI is $DBI::VERSION, not 1.643\n" unless $DBI::VERSION eq "1.643"; print "DBI $DBI::VERSION\n"'
      - name: yath
        run: yath test

  # Perl::Critic and Perl::Tidy, with the repository's profiles, on the
  # newest Perl. A file perltidy would change fails, showing the diff.
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.44"
      - name: dependencies
        run: cpanm --notest --installdeps --with-develop .
      - name: perlcritic
        run: perlcritic lib
      - name: perltidy
        run: |
          status=0
          for f in $(git ls-files 'lib/*.pm' 't/*.t' 'xt/*.t'); do
            perltidy "$f" | diff -u "$f" - || status=1
          done
          exit $status

  # The tests under Devel::Cover, on Perl 5.36, the floor, failing if the
  # coverage of lib/ falls below the floors in scripts/coverage. There's
  # no MySQL or PostgreSQL here, so the floors are what SQLite reaches.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.36"
      - name: dependencies
        run: cpanm --notest --installdeps --with-develop .
      - name: coverage
        run: scripts/coverage

  # Secrets in any commit, not only the latest: gitleaks over the whole
  # history, since all of it is published with the repository. Its release
  # is checked against its published SHA-256 before it's used.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
